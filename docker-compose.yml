version: '3.8'

services:
  # Ray Head Node & vLLM API Gateway
  vllm-head:
    build:
      context: .
      dockerfile: Dockerfile
    image: vllm-inference-server:latest
    container_name: vllm-head-server
    restart: unless-stopped
    ports:
      - "${VLLM_PORT:-8000}:8000"
      - "6379:6379"  # Ray Redis GCS Port
      - "8265:8265"  # Ray Dashboard
    ipc: host
    shm_size: 16gb
    environment:
      - MODEL=${MODEL:-meta-llama/Meta-Llama-3-8B-Instruct}
      - TENSOR_PARALLEL_SIZE=${TENSOR_PARALLEL_SIZE:-1}
      - PIPELINE_PARALLEL_SIZE=${PIPELINE_PARALLEL_SIZE:-1}
      - MAX_MODEL_LEN=${MAX_MODEL_LEN:-8192}
      - GPU_MEMORY_UTILIZATION=${GPU_MEMORY_UTILIZATION:-0.90}
      - MAX_NUM_SEQS=${MAX_NUM_SEQS:-256}
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN:-}
    command: >
      --model ${MODEL:-meta-llama/Meta-Llama-3-8B-Instruct}
      --tensor-parallel-size ${TENSOR_PARALLEL_SIZE:-1}
      --max-model-len ${MAX_MODEL_LEN:-8192}
      --gpu-memory-utilization ${GPU_MEMORY_UTILIZATION:-0.90}
      --max-num-seqs ${MAX_NUM_SEQS:-256}
      --host 0.0.0.0
      --port 8000
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - hf_cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 45s
    networks:
      - inference_mesh

  # Ray Distributed Worker Node for Multi-GPU / Multi-Node Scalability
  vllm-worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: vllm-inference-server:latest
    container_name: vllm-ray-worker
    restart: unless-stopped
    depends_on:
      vllm-head:
        condition: service_healthy
    ipc: host
    shm_size: 16gb
    entrypoint: ["ray", "start"]
    command: ["--address=vllm-head:6379", "--block"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - hf_cache:/root/.cache/huggingface
    networks:
      - inference_mesh

volumes:
  hf_cache:
    name: vllm_huggingface_cache

networks:
  inference_mesh:
    name: inference_mesh
    driver: bridge
